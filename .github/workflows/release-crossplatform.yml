name: Release (cross-platform)

# Publishes self-contained builds of BOTH the Avalonia desktop GUI (DicomRtNifti.App) and the
# .NET 8 headless CLI (DicomRtNifti.Cli) for win-x64, linux-x64 and osx-arm64. Every bundle
# carries LICENSE and THIRD-PARTY-NOTICES.md, and the verify step runs the bundled CLI once, so a
# bundle whose SimpleITK native does not load is never released.
#
# Gated on the conformance workflow: nothing is published for a commit until
# "Conformance (cross-platform)" has passed on that exact commit.
#   - push to main      -> runs via workflow_run after a green conformance run on the commit and
#                          refreshes the rolling `latest-build` pre-release (a red run skips it);
#   - tag v<semver>     -> publishes a stable release named after the tag, built with that version
#                          (-p:Version), once the tagged commit has a green conformance run (it had
#                          one when it landed on main);
#   - workflow_dispatch -> builds and packages on all three OSes and publishes only from main; on
#                          any ref the gate job first looks up the conformance run for the commit
#                          and fails, naming what is missing, if it has not passed.

on:
  workflow_run:
    workflows: ["Conformance (cross-platform)"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  SIMPLEITK_BASE_URL: "https://github.com/SimpleITK/SimpleITK/releases/download/v2.5.0"
  CONFORMANCE_WORKFLOW: "Conformance (cross-platform)"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gate:
    name: Require a green conformance run for this commit
    runs-on: ubuntu-latest
    # A workflow_run for a failed or cancelled conformance run ends here, visibly skipped.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      version_arg: ${{ steps.meta.outputs.version_arg }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Resolve the commit, the version, and whether this run publishes
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            branch="${{ github.event.workflow_run.head_branch }}"
            echo "conformance passed on $sha ($branch): ${{ github.event.workflow_run.html_url }}"
          else
            sha="${{ github.sha }}"
            branch="${{ github.ref_name }}"
            # Not triggered by the conformance workflow itself: look up its run for this exact commit.
            conclusion="$(gh run list --repo "${{ github.repository }}" \
                --workflow "${{ env.CONFORMANCE_WORKFLOW }}" --commit "$sha" --status completed \
                --limit 1 --json conclusion --jq 'map(.conclusion) | first // "none"')"
            if [ "$conclusion" != "success" ]; then
              echo "::error::'${{ env.CONFORMANCE_WORKFLOW }}' has not passed on $sha (latest completed run: $conclusion). Publishing waits on a green conformance run for this commit."
              exit 1
            fi
            echo "conformance passed on $sha ($branch)"
          fi

          sha7="$(echo "$sha" | cut -c1-7)"
          if [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
            version_arg="-p:Version=$version"
            release_name="$tag"
            prerelease=false
            publish=true
          else
            tag="latest-build"
            version="latest-$(date -u +%Y%m%d)-$sha7"
            version_arg=""
            release_name="Latest build ($version)"
            prerelease=true
            if [ "$branch" = "main" ]; then publish=true; else publish=false; fi
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "version_arg=$version_arg"
            echo "tag=$tag"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag prerelease=$prerelease publish=$publish"

  build:
    name: Publish GUI + CLI (${{ matrix.rid }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            sitk_zip: SimpleITK-2.5.0-CSharp-win64-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            sitk_zip: SimpleITK-2.5.0-CSharp-linux_x86_64.zip
          - os: macos-latest
            rid: osx-arm64
            sitk_zip: SimpleITK-2.5.0-CSharp-macosx-11.0-anycpu.zip

    steps:
      - name: Checkout the gated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage SimpleITK C# binaries (per-OS) one level above the workspace
        run: python .github/scripts/stage_simpleitk.py "${{ env.SIMPLEITK_BASE_URL }}/${{ matrix.sitk_zip }}" "${{ github.workspace }}"

      - name: Ad-hoc sign the SimpleITK native (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dylib="$(dirname "$GITHUB_WORKSPACE")/SimpleITK/libSimpleITKCSharpNative.dylib"
          xattr -cr "$dylib" || true
          codesign --force --sign - "$dylib" || true

      - name: Publish self-contained CLI
        run: dotnet publish src/DicomRtNifti.Cli/DicomRtNifti.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish-cli ${{ needs.gate.outputs.version_arg }}

      - name: Publish self-contained GUI (Avalonia)
        run: dotnet publish src/DicomRtNifti.App/DicomRtNifti.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish-app ${{ needs.gate.outputs.version_arg }}

      - name: Verify bundles (exe, native, LICENSE, THIRD-PARTY-NOTICES.md; bundled CLI runs)
        shell: bash
        run: |
          set -e
          case "${{ matrix.rid }}" in
            win-x64)   cli=DicomRtNifti.Cli.exe; app=DicomRtNifti.App.exe; nat=SimpleITKCSharpNative.dll;;
            linux-x64) cli=DicomRtNifti.Cli;     app=DicomRtNifti.App;     nat=libSimpleITKCSharpNative.so;;
            osx-arm64) cli=DicomRtNifti.Cli;     app=DicomRtNifti.App;     nat=libSimpleITKCSharpNative.dylib;;
          esac
          test -f "publish-cli/$cli" || { echo "::error::missing $cli in CLI publish output"; exit 1; }
          test -f "publish-app/$app" || { echo "::error::missing $app in GUI publish output"; exit 1; }
          for dir in publish-cli publish-app; do
            for f in "$nat" LICENSE THIRD-PARTY-NOTICES.md; do
              test -f "$dir/$f" || { echo "::error::missing $f in $dir"; exit 1; }
            done
          done
          echo "OK: CLI ($cli) + GUI ($app) + native ($nat) + LICENSE + THIRD-PARTY-NOTICES.md present in both bundles"

          # The bundle must run and must know which commit it was built from.
          out="$("./publish-cli/$cli" --version)"
          echo "$out"
          echo "$out" | grep -Eq '^DICOM RT Toolkit CLI [0-9]+\.[0-9]+\.[0-9]+\+[0-9a-f]{7,}' \
            || { echo "::error::bundled CLI does not report a version carrying its commit sha"; exit 1; }
          echo "$out" | grep -q "SimpleITK native: OK" \
            || { echo "::error::SimpleITK native did not load from the ${{ matrix.rid }} bundle"; exit 1; }

      - name: Package (zip, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish-cli/* -DestinationPath "DicomRtNifti-cli-${{ matrix.rid }}.zip" -CompressionLevel Optimal
          Compress-Archive -Path publish-app/* -DestinationPath "DicomRtNifti-gui-${{ matrix.rid }}.zip" -CompressionLevel Optimal

      - name: Package (tar.gz, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "DicomRtNifti-cli-${{ matrix.rid }}.tar.gz" -C publish-cli .
          tar -czf "DicomRtNifti-gui-${{ matrix.rid }}.tar.gz" -C publish-app .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: |
            DicomRtNifti-cli-${{ matrix.rid }}.zip
            DicomRtNifti-cli-${{ matrix.rid }}.tar.gz
            DicomRtNifti-gui-${{ matrix.rid }}.zip
            DicomRtNifti-gui-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.gate.outputs.tag }}
    needs: [gate, build]
    runs-on: ubuntu-latest
    # Rolling pre-release only from main; stable releases only from a v* tag. A dispatch on a
    # feature branch still validates the cross-platform publish above and stops here.
    if: needs.gate.outputs.publish == 'true'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Delete the previous rolling pre-release
        if: needs.gate.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ needs.gate.outputs.tag }}" --yes --cleanup-tag \
            --repo "${{ github.repository }}" || echo "No prior ${{ needs.gate.outputs.tag }} release (first run)."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          name: ${{ needs.gate.outputs.release_name }}
          body: |
            Self-contained builds of the cross-platform app for **win-x64**, **linux-x64**, and
            **osx-arm64** (Apple Silicon). No .NET runtime install required.

            - **GUI** (Avalonia desktop): `DicomRtNifti-gui-<rid>` — unzip/untar and run `DicomRtNifti.App`.
            - **CLI** (headless): `DicomRtNifti-cli-<rid>` — unzip/untar and run `DicomRtNifti.Cli --help`.
            - Each bundle contains `LICENSE` and `THIRD-PARTY-NOTICES.md`. First run on each OS
              (SmartScreen, Gatekeeper, executable bit): see "Running a prebuilt release" in the README.
            - Built from commit ${{ needs.gate.outputs.sha }} after a green "Conformance (cross-platform)" run on that commit.
            - Research use only: this software is not a medical device and has not been cleared or
              approved by any regulatory body for clinical use.
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.gate.outputs.prerelease != 'true' }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
